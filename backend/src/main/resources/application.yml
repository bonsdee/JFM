server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true

spring:
  application:
    name: jfm-printhub
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # Supabase transaction pooler (port 6543) does not support prepared statements.
      data-source-properties:
        prepareThreshold: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

app:
  timezone: Asia/Manila
  owner:
    id: ${APP_OWNER_ID}
    email: ${APP_OWNER_EMAIL:}
  supabase:
    url: ${SUPABASE_URL}
    jwks-url: ${SUPABASE_JWKS_URL:}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    buckets:
      product-images: product-images
      job-files: job-files
      business-assets: business-assets
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    inquiries-per-hour: 5
    quotes-per-minute: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.jfmprinthub: INFO
