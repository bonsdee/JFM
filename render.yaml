# Render Blueprint for the Spring Boot API (Docker). Fill the secret values in the Render dashboard.
services:
  - type: web
    name: jfm-printhub-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_OWNER_ID
        sync: false
      - key: APP_OWNER_EMAIL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
