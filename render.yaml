# Render Blueprint — runs the whole JFM PrintHub stack on Render's FREE tier.
#   jfm-printhub-api : Spring Boot API (Docker, free web service — sleeps after 15 min idle)
#   jfm-printhub-web : React app (free static site — always on, global CDN)
# Fill every `sync: false` value in the Render dashboard when you create the Blueprint.
services:
  - type: web
    name: jfm-printhub-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Tuned for the free instance (512 MB RAM, 0.1 CPU): small heap, serial GC, faster startup.
      - key: JAVA_OPTS
        value: >-
          -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
          -Xss512k -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=160m
          -Duser.timezone=UTC
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_OWNER_ID
        sync: false
      - key: APP_OWNER_EMAIL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: jfm-printhub-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_OWNER_EMAIL
        sync: false
